name: EVM

on:
  push:
    branches: [main, develop]
    paths: ["evm/**", ".github/workflows/evm.yml", ".gitmodules"]
  pull_request:
    paths: ["evm/**", ".github/workflows/evm.yml", ".gitmodules"]

jobs:
  forge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Format
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv
